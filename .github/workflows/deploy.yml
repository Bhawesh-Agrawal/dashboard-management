name: Deploy to GCP

# Manual dispatch only while GCP_SA_KEY is disabled; re-enable push triggers
# once Workload Identity Federation (WIF) is configured (see infra/deploy-comparison.md).
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: dashboard-management-prod

      - name: Submit Cloud Build & Deploy
        run: |
          gcloud builds submit --config=cloudbuild.yaml .
