steps:
  - name: 'gcr.io/cloud-builders/docker'
    secretEnv: ['NEXT_PUBLIC_VAPID_PUBLIC_KEY', 'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker build \
          --build-arg=NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL \
          --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
          --build-arg=NEXT_PUBLIC_VAPID_PUBLIC_KEY=$$NEXT_PUBLIC_VAPID_PUBLIC_KEY \
          -t $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$BUILD_ID \
          -t $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --min-instances=0
      - --max-instances=2
      - --cpu-boost
      - --memory=512Mi
      - --cpu=1
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,OPENROUTER_MODEL=OPENROUTER_MODEL:latest,GOOGLE_CALENDAR_CLIENT_ID=GOOGLE_CALENDAR_CLIENT_ID:latest,GOOGLE_CALENDAR_CLIENT_SECRET=GOOGLE_CALENDAR_CLIENT_SECRET:latest,GOOGLE_CALENDAR_REDIRECT_URI=GOOGLE_CALENDAR_REDIRECT_URI:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,VAPID_EMAIL=VAPID_EMAIL:latest,CRON_BEARER_TOKEN=CRON_BEARER_TOKEN:latest,NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:latest,NEXT_PUBLIC_VAPID_PUBLIC_KEY=NEXT_PUBLIC_VAPID_PUBLIC_KEY:latest,S3_ENDPOINT=S3_ENDPOINT:latest,S3_PUBLIC_ENDPOINT=S3_PUBLIC_ENDPOINT:latest,S3_REGION=S3_REGION:latest,S3_FORCE_PATH_STYLE=S3_FORCE_PATH_STYLE:latest,S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest,S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest,S3_BUCKET=S3_BUCKET:latest
      - --set-env-vars=NODE_ENV=production,DEPLOY_ENV=production,CRON_OIDC_SERVICE_ACCOUNT=$_SCHEDULER_SA
      - --allow-unauthenticated

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        SERVICE_URL=$$(gcloud run services describe $_SERVICE_NAME --region=$_REGION --format="value(status.url)")
        
        # Job 1: 5-minute notification tick (06:00 to 23:00 Asia/Kathmandu)
        # Handles upcoming class push alerts and brief window checks
        gcloud scheduler jobs update http notifications \
          --location=$_REGION \
          --schedule="*/5 6-23 * * *" \
          --time-zone="Asia/Kathmandu" \
          --uri="$$SERVICE_URL/api/notifications/trigger" \
          --oidc-service-account-email=$_SCHEDULER_SA \
          --oidc-token-audience="$$SERVICE_URL" || \
        gcloud scheduler jobs create http notifications \
          --location=$_REGION \
          --schedule="*/5 6-23 * * *" \
          --time-zone="Asia/Kathmandu" \
          --uri="$$SERVICE_URL/api/notifications/trigger" \
          --oidc-service-account-email=$_SCHEDULER_SA \
          --oidc-token-audience="$$SERVICE_URL"

        # Job 2: Daily maintenance job (02:00 Asia/Kathmandu)
        # Aggregates insights, knowledge gap analysis, and review generation
        gcloud scheduler jobs update http daily-maintenance \
          --location=$_REGION \
          --schedule="0 2 * * *" \
          --time-zone="Asia/Kathmandu" \
          --uri="$$SERVICE_URL/api/cron/daily-diagnostics" \
          --oidc-service-account-email=$_SCHEDULER_SA \
          --oidc-token-audience="$$SERVICE_URL" || \
        gcloud scheduler jobs create http daily-maintenance \
          --location=$_REGION \
          --schedule="0 2 * * *" \
          --time-zone="Asia/Kathmandu" \
          --uri="$$SERVICE_URL/api/cron/daily-diagnostics" \
          --oidc-service-account-email=$_SCHEDULER_SA \
          --oidc-token-audience="$$SERVICE_URL"

        # Job 3: Spare slot reserved (at most 3 jobs total)
        echo "Successfully consolidated and updated Cloud Scheduler jobs with OIDC to $$SERVICE_URL"

substitutions:
  _REGION: asia-south1
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_REPO: dashboard-management
  _SERVICE_NAME: dashboard-management
  _SCHEDULER_SA: scheduler-invoker@dashboard-management-prod.iam.gserviceaccount.com

availableSecrets:
  secretManager:
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_VAPID_PUBLIC_KEY/versions/latest
      env: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

options:
  dynamic_substitutions: true
  # Machine type rationale: Next.js standalone Turbopack compilation inside Docker requires
  # >4GB RAM and multi-core CPU to avoid build-time out-of-memory crashes experienced on default e2-standard-2.
  machineType: E2_HIGHCPU_8
