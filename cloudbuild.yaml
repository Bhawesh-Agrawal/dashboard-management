steps:
  - name: 'gcr.io/cloud-builders/docker'
    secretEnv: ['NEXT_PUBLIC_VAPID_PUBLIC_KEY', 'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker build \
          --build-arg=NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL \
          --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
          --build-arg=NEXT_PUBLIC_VAPID_PUBLIC_KEY=$$NEXT_PUBLIC_VAPID_PUBLIC_KEY \
          -t $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$BUILD_ID \
          -t $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --min-instances=0
      - --max-instances=2
      - --cpu-boost
      - --memory=512Mi
      - --cpu=1
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,OPENROUTER_MODEL=OPENROUTER_MODEL:latest,GOOGLE_CALENDAR_CLIENT_ID=GOOGLE_CALENDAR_CLIENT_ID:latest,GOOGLE_CALENDAR_CLIENT_SECRET=GOOGLE_CALENDAR_CLIENT_SECRET:latest,GOOGLE_CALENDAR_REDIRECT_URI=GOOGLE_CALENDAR_REDIRECT_URI:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,VAPID_EMAIL=VAPID_EMAIL:latest,CRON_SECRET=CRON_SECRET:latest,NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:latest,NEXT_PUBLIC_VAPID_PUBLIC_KEY=NEXT_PUBLIC_VAPID_PUBLIC_KEY:latest,S3_ENDPOINT=S3_ENDPOINT:latest,S3_PUBLIC_ENDPOINT=S3_PUBLIC_ENDPOINT:latest,S3_REGION=S3_REGION:latest,S3_FORCE_PATH_STYLE=S3_FORCE_PATH_STYLE:latest,S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest,S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest,S3_BUCKET=S3_BUCKET:latest
      - --set-env-vars=NODE_ENV=production
      - --allow-unauthenticated

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    secretEnv: ['CRON_SECRET']
    args:
      - '-c'
      - |
        SERVICE_URL=$$(gcloud run services describe $_SERVICE_NAME --region=$_REGION --format="value(status.url)")
        CRON_URL="$$SERVICE_URL/api/cron/daily-diagnostics"
        NOTIF_URL="$$SERVICE_URL/api/notifications/trigger"
        gcloud scheduler jobs update http daily-diagnostics --location=$_REGION --uri="$$CRON_URL" --headers="Authorization=Bearer $$CRON_SECRET"
        gcloud scheduler jobs update http notifications --location=$_REGION --uri="$$NOTIF_URL" --headers="Authorization=Bearer $$CRON_SECRET"
        echo "Updated Cloud Scheduler URLs to $$SERVICE_URL"

substitutions:
  _REGION: asia-south1
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_REPO: dashboard-management
  _SERVICE_NAME: dashboard-management

availableSecrets:
  secretManager:
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_VAPID_PUBLIC_KEY/versions/latest
      env: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL
    - versionName: projects/dashboard-management-prod/secrets/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    - versionName: projects/dashboard-management-prod/secrets/CRON_SECRET/versions/latest
      env: CRON_SECRET

options:
  dynamic_substitutions: true
  machineType: E2_HIGHCPU_8
